<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyBase</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="top-bar" aria-label="MyBase 홈">
        <nav class="main-tabs" aria-label="메인 화면">
          <button class="main-tab is-active" type="button" data-main-tab="games">예정 경기</button>
          <button class="main-tab" type="button" data-main-tab="standings">팀 순위</button>
        </nav>
        <button class="icon-button" id="authButton" type="button" aria-label="로그인">
          <span></span>
        </button>
      </header>

      <section class="game-list" id="gameList" aria-label="오늘 경기 목록">
        <article class="state-card">오늘 경기 정보를 불러오는 중입니다.</article>
      </section>
    </main>

    <script src="live-game-card.js"></script>
    <script src="app.js"></script>
  </body>
</html>
